plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "tactical_tablet" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "tactical_tablet_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            server()
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=reports/junit.xml"
            runDir "build/gametest"
        }
        smoke {
            client()
            name "Smoke"
            source sourceSets.client
            vmArg "-Dtactical_tablet.smoke=${project.findProperty('smoke') ?: 'ORBITAL_LASER'}"
            runDir "build/smoke"
        }
        benchmark {
            server()
            name "Benchmark"
            vmArg "-Dtactical_tablet.benchmark=${project.findProperty('bench') ?: '100,5'}"
            programArg "nogui"
            runDir "build/benchmark"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

test {
    useJUnitPlatform()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}
